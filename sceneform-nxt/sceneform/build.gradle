apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.google.ar.sceneform"
    compileSdkVersion 36
    defaultConfig {
        // Sceneform requires minSdkVersion >= 24.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'filamat','ktx'
    }

    kotlinOptions { jvmTarget = "17" }

}

dependencies {

    implementation files("../libs/libsceneform_runtime_schemas.jar")

    api "com.google.ar:core:1.51.0"

    api "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    api "androidx.appcompat:appcompat:1.7.0"
    api "androidx.activity:activity:1.10.1"
    api "androidx.fragment:fragment:1.8.6"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.9.0"
    api "com.github.kittinunf.fuel:fuel:2.3.1"
    api "com.github.kittinunf.fuel:fuel-coroutines:2.3.1"
    
    api "com.google.android.filament:filament-android:1.70.1"
    api "com.google.android.filament:filamat-android:1.70.1"
    api "com.google.android.filament:gltfio-android:1.70.1"
    api "com.google.android.filament:filament-utils-android:1.70.1"

}
